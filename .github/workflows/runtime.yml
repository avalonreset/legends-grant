name: evidence-runtime

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Release static gate
        run: python scripts/check_release.py
      - name: Install runtime with PDF extra
        run: python -m pip install ".[pdf]"
      - name: Offline evidence and registry tests
        run: python -m unittest discover -s tests -v
      - name: CLI entry point
        run: python -m grant_engine --help
      - name: Synthetic proposal check and render
        run: |
          python -m grant_engine proposal check --proposal examples/proposal.json --facts examples/proposal-facts.json
          python -m grant_engine proposal render --proposal examples/proposal.json --facts examples/proposal-facts.json --output "${{ runner.temp }}/proposal-draft.md"
      - name: Installed package works outside checkout
        working-directory: ${{ runner.temp }}
        run: python -m grant_engine doctor

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "legends-grant-evidence"
dynamic = ["version"]
description = "US grant discovery, evidence, qualification, and proposal workbench"
requires-python = ">=3.11"
dependencies = []
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]

[project.urls]
Homepage = "https://cto-legends.com/modules/legends-grant"
Documentation = "https://cto-legends.com/modules/legends-grant"
Repository = "https://github.com/avalonreset/legends-grant"
Issues = "https://github.com/avalonreset/legends-grant/issues"
Releases = "https://github.com/avalonreset/legends-grant/releases"

[project.optional-dependencies]
pdf = ["pypdf>=6,<7"]

[project.scripts]
grant-engine = "grant_engine.__main__:main"

[tool.setuptools]
packages = ["grant_engine", "grant_engine.data"]

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.package-data]
grant_engine = ["data/*.json"]
